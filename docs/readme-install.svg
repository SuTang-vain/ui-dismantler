<svg width="760" height="330" viewBox="0 0 760 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recommended ui-dismantler installation flow">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'Courier New', ui-monospace, monospace; }
    </style>
  </defs>
  <rect x="10" y="10" width="740" height="310" rx="14" fill="#0D152A" stroke="#2A4168"/>
  <rect x="10" y="10" width="740" height="40" rx="14" fill="#111D37"/>
  <path d="M10 50H750" stroke="#263B61"/>
  <circle cx="34" cy="30" r="5" fill="#F46E7B"/><circle cx="54" cy="30" r="5" fill="#F3B562"/><circle cx="74" cy="30" r="5" fill="#62D6A7"/>
  <text x="380" y="34" text-anchor="middle" class="mono" font-size="10" style="fill:#7F91B4">recommended local setup</text>
  <g class="mono" font-size="12">
    <text x="34" y="84" style="fill:#71E5EF">$ node --version</text>
    <text x="34" y="106" style="fill:#A8B7D6">v18+ required</text>
    <text x="34" y="138" style="fill:#71E5EF">$ npm install</text>
    <text x="34" y="160" style="fill:#62D6A7">added dependencies</text>
    <text x="34" y="192" style="fill:#71E5EF">$ npm run build:ts</text>
    <text x="34" y="214" style="fill:#62D6A7">compiled to dist-ts/</text>
    <text x="34" y="246" style="fill:#71E5EF">$ node dist-ts/cli.js --help</text>
    <text x="34" y="268" style="fill:#F3B562">ready for your first analysis</text>
  </g>
  <rect x="514" y="82" width="190" height="190" rx="12" fill="#101D35" stroke="#2A6681"/>
  <text x="534" y="112" class="mono" font-size="10" letter-spacing="1.4" style="fill:#6F83A7">INSTALL CONTRACT</text>
  <g class="mono" font-size="11">
    <text x="534" y="142" style="fill:#A8B7D6">✓ Node >= 18</text>
    <text x="534" y="169" style="fill:#A8B7D6">✓ npm lockfile</text>
    <text x="534" y="196" style="fill:#A8B7D6">✓ deterministic build</text>
    <text x="534" y="223" style="fill:#A8B7D6">✓ CLI help check</text>
    <text x="534" y="250" style="fill:#71E5EF">→ next: analyze</text>
  </g>
</svg>
