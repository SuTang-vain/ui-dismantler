<svg width="1100" height="300" viewBox="0 0 1100 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ui-dismantler pipeline from source inspection to verified component library">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D152A"/><stop offset="1" stop-color="#111D37"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'Courier New', ui-monospace, monospace; }
    </style>
  </defs>
  <rect x="4" y="4" width="1092" height="292" rx="16" fill="url(#panel)" stroke="#2A4168"/>
  <text x="34" y="38" class="mono" font-size="11" letter-spacing="2" style="fill:#6F83A7">THE PRODUCTION LOOP</text>
  <text x="34" y="67" class="sans" font-size="21" font-weight="700" style="fill:#F4F7FF">From source code to evidence-backed components</text>
  <g class="mono" font-size="10" font-weight="600" letter-spacing="1.2">
    <text x="34" y="101" style="fill:#6F83A7">INPUT</text><text x="1028" y="101" text-anchor="end" style="fill:#6F83A7">OUTPUT</text>
  </g>
  <g transform="translate(34 120)">
    <g>
      <rect width="170" height="126" rx="12" fill="#111D37" stroke="#2A6681"/>
      <rect x="16" y="16" width="32" height="4" rx="2" fill="#25D9E8"/>
      <text x="16" y="43" class="mono" font-size="10" style="fill:#71E5EF">01 / INSPECT</text>
      <text x="16" y="70" class="sans" font-size="15" font-weight="700" style="fill:#F4F7FF">Read the source</text>
      <text x="16" y="94" class="sans" font-size="11" style="fill:#A8B7D6">DOM, CSS, SFC, routes,</text><text x="16" y="111" class="sans" font-size="11" style="fill:#A8B7D6">assets and API clues.</text>
    </g>
    <path d="M184 63H208" stroke="#25D9E8" stroke-width="2"/><path d="M202 57L208 63L202 69" stroke="#25D9E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(218)">
      <rect width="170" height="126" rx="12" fill="#111D37" stroke="#2A4168"/>
      <rect x="16" y="16" width="32" height="4" rx="2" fill="#B99CFF"/>
      <text x="16" y="43" class="mono" font-size="10" style="fill:#B99CFF">02 / MODEL</text>
      <text x="16" y="70" class="sans" font-size="15" font-weight="700" style="fill:#F4F7FF">Build evidence</text>
      <text x="16" y="94" class="sans" font-size="11" style="fill:#A8B7D6">Skills emit graphs,</text><text x="16" y="111" class="sans" font-size="11" style="fill:#A8B7D6">manifests and blockers.</text>
    </g>
    <path d="M402 63H426" stroke="#25D9E8" stroke-width="2"/><path d="M420 57L426 63L420 69" stroke="#25D9E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(436)">
      <rect width="170" height="126" rx="12" fill="#111D37" stroke="#2A4168"/>
      <rect x="16" y="16" width="32" height="4" rx="2" fill="#F3B562"/>
      <text x="16" y="43" class="mono" font-size="10" style="fill:#F3B562">03 / PLAN</text>
      <text x="16" y="70" class="sans" font-size="15" font-weight="700" style="fill:#F4F7FF">Resolve a profile</text>
      <text x="16" y="94" class="sans" font-size="11" style="fill:#A8B7D6">Compose dependencies</text><text x="16" y="111" class="sans" font-size="11" style="fill:#A8B7D6">in deterministic order.</text>
    </g>
    <path d="M620 63H644" stroke="#25D9E8" stroke-width="2"/><path d="M638 57L644 63L638 69" stroke="#25D9E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(654)">
      <rect width="170" height="126" rx="12" fill="#111D37" stroke="#2A4168"/>
      <rect x="16" y="16" width="32" height="4" rx="2" fill="#62D6A7"/>
      <text x="16" y="43" class="mono" font-size="10" style="fill:#62D6A7">04 / PRODUCE</text>
      <text x="16" y="70" class="sans" font-size="15" font-weight="700" style="fill:#F4F7FF">Materialize output</text>
      <text x="16" y="94" class="sans" font-size="11" style="fill:#A8B7D6">Generate components,</text><text x="16" y="111" class="sans" font-size="11" style="fill:#A8B7D6">styles and contracts.</text>
    </g>
    <path d="M838 63H862" stroke="#25D9E8" stroke-width="2"/><path d="M856 57L862 63L856 69" stroke="#25D9E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(872)">
      <rect width="170" height="126" rx="12" fill="#172A2B" stroke="#2D796D"/>
      <rect x="16" y="16" width="32" height="4" rx="2" fill="#62D6A7"/>
      <text x="16" y="43" class="mono" font-size="10" style="fill:#62D6A7">05 / VERIFY</text>
      <text x="16" y="70" class="sans" font-size="15" font-weight="700" style="fill:#F4F7FF">Pass quality gates</text>
      <text x="16" y="94" class="sans" font-size="11" style="fill:#B9DCD4">Runtime, roundtrip,</text><text x="16" y="111" class="sans" font-size="11" style="fill:#B9DCD4">visual and Gold+ checks.</text>
    </g>
  </g>
</svg>
