<!doctype html><html><head><meta charset="utf-8"><style>
#focus-good:focus-visible{outline:3px solid #005fcc;outline-offset:2px} #focus-bad:focus-visible{outline:none;box-shadow:none} #low{color:#777;background:#fff;font-size:16px} #large{color:#949494;background:#fff;font-size:24px} #gradient{color:#aaa;background:linear-gradient(#fff,#000)} #small{width:20px;height:20px} #action{width:100px;height:44px;color:#222;background:#fff;position:relative;z-index:2}
#wide{width:600px;height:30px;overflow:hidden} #reflow-bad{width:500px;height:40px} #reflow-scroll-wrap{width:300px;overflow-x:auto} #reflow-scroll{width:500px;height:40px} #keyboard-good,#keyboard-bad,#keyboard-tab-inactive,#tabindex-positive{display:block;width:120px;height:32px;margin-top:8px} #keyboard-good:focus-visible{outline:2px solid #005fcc} #keyboard-bad:focus-visible{outline:2px solid #005fcc}
@media(max-width:500px){#action{width:80px}}
</style></head><body><button id="focus-good">Focus good</button><button id="focus-bad">Focus bad</button><p id="low">Low contrast</p><h1 id="large">Large text</h1><p id="gradient">Unknown background</p><button id="small">Small</button><button id="action" aria-label="Save">Save</button><div id="wide">Wide content</div><div id="keyboard-bad" role="button" onclick="return false">Keyboard bad</div><div id="keyboard-good" role="button" tabindex="0">Keyboard good</div><div role="tablist"><div id="keyboard-tab-inactive" role="tab" tabindex="-1">Inactive tab</div></div><button id="tabindex-positive" tabindex="3">Priority action</button><div id="reflow-bad">Reflow bad</div><div id="reflow-scroll-wrap"><div id="reflow-scroll">Bounded horizontal content</div></div><button id="state-expanded-bad" aria-expanded="true" aria-controls="state-panel-hidden">Expanded bad</button><button id="state-expanded-good" aria-expanded="true" aria-controls="state-panel-visible">Expanded good</button><button id="state-collapsed-bad" aria-expanded="false" aria-controls="state-panel-visible">Collapsed bad</button><div id="state-panel-hidden" hidden>Hidden panel</div><div id="state-panel-visible">Visible panel</div><div role="tablist"><button id="state-tab-selected-bad" role="tab" aria-selected="true" aria-controls="state-tabpanel-hidden">Selected bad</button><button id="state-tab-inactive-good" role="tab" aria-selected="false" aria-controls="state-tabpanel-hidden">Inactive good</button></div><div id="state-tabpanel-hidden" role="tabpanel" hidden>Hidden tabpanel</div><button id="state-invalid-pressed" aria-pressed="yes">Invalid pressed</button></body></html>
