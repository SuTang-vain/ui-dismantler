<!doctype html><html><head><meta charset="utf-8"><style>
#focus-good:focus-visible{outline:3px solid #005fcc;outline-offset:2px} #focus-bad:focus-visible{outline:none;box-shadow:none} #low{color:#777;background:#fff;font-size:16px} #large{color:#949494;background:#fff;font-size:24px} #gradient{color:#aaa;background:linear-gradient(#fff,#000)} #small{width:20px;height:20px} #action{width:100px;height:44px;color:#222;background:#fff;position:relative;z-index:2}
#wide{width:600px;height:30px;overflow:hidden} #spacing-good,#spacing-bad,#spacing-wrapped,#spacing-heterogeneous,#spacing-element{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;width:300px;height:40px;margin-top:8px} .spacing-item{display:block;width:40px;height:32px;background:#ddd} #spacing-bad .spacing-item:nth-child(2){margin-right:8px} #spacing-wrapped{flex-wrap:wrap} #spacing-heterogeneous .spacing-item:nth-child(2){display:block} #reflow-bad{width:500px;height:40px} #reflow-scroll-wrap{width:300px;overflow-x:auto} #reflow-scroll{width:500px;height:40px} #keyboard-good,#keyboard-bad,#keyboard-tab-inactive,#tabindex-positive{display:block;width:120px;height:32px;margin-top:8px} #keyboard-good:focus-visible{outline:2px solid #005fcc} #keyboard-bad:focus-visible{outline:2px solid #005fcc}
@media(max-width:500px){#action{width:80px}}
</style></head><body><button id="focus-good">Focus good</button><button id="focus-bad">Focus bad</button><p id="low">Low contrast</p><h1 id="large">Large text</h1><p id="gradient">Unknown background</p><button id="small">Small</button><button id="action" aria-label="Save">Save</button><div id="wide">Wide content</div><div id="keyboard-bad" role="button" onclick="return false">Keyboard bad</div><div id="keyboard-good" role="button" tabindex="0">Keyboard good</div><div role="tablist"><div id="keyboard-tab-inactive" role="tab" tabindex="-1">Inactive tab</div></div><button id="tabindex-positive" tabindex="3">Priority action</button><div id="reflow-bad">Reflow bad</div><div id="reflow-scroll-wrap"><div id="reflow-scroll">Bounded horizontal content</div></div><button id="state-expanded-bad" aria-expanded="true" aria-controls="state-panel-hidden">Expanded bad</button><button id="state-expanded-good" aria-expanded="true" aria-controls="state-panel-visible">Expanded good</button><button id="state-collapsed-bad" aria-expanded="false" aria-controls="state-panel-visible">Collapsed bad</button><div id="state-panel-hidden" hidden>Hidden panel</div><div id="state-panel-visible">Visible panel</div><div role="tablist"><button id="state-tab-selected-bad" role="tab" aria-selected="true" aria-controls="state-tabpanel-hidden">Selected bad</button><button id="state-tab-inactive-good" role="tab" aria-selected="false" aria-controls="state-tabpanel-hidden">Inactive good</button></div><div id="state-tabpanel-hidden" role="tabpanel" hidden>Hidden tabpanel</div><button id="state-invalid-pressed" aria-pressed="yes">Invalid pressed</button><button id="transition-expanded-good" aria-expanded="false" aria-controls="transition-panel-good">Expanded good</button><div id="transition-panel-good" hidden>Good panel</div><button id="transition-expanded-stale" aria-expanded="false" aria-controls="transition-panel-stale">Expanded stale</button><div id="transition-panel-stale" hidden>Stale panel</div><button id="transition-expanded-visibility-bad" aria-expanded="false" aria-controls="transition-panel-hidden">Visibility bad</button><div id="transition-panel-hidden" hidden>Hidden panel</div><button id="transition-pressed-good" aria-pressed="false">Pressed good</button><button id="transition-pressed-stale" aria-pressed="false">Pressed stale</button><div role="tablist"><button id="transition-tab-good" role="tab" aria-selected="false" aria-controls="transition-tabpanel">Tab good</button><button id="transition-tab-stale" role="tab" aria-selected="false" aria-controls="transition-tabpanel-stale">Tab stale</button></div><div id="transition-tabpanel" role="tabpanel" hidden>Tabpanel</div><div id="transition-tabpanel-stale" role="tabpanel" hidden>Stale tabpanel</div><button id="transition-invalid-after" aria-pressed="false">Invalid after</button><script>document.getElementById('transition-expanded-good').onclick=function(){this.setAttribute('aria-expanded','true');document.getElementById('transition-panel-good').hidden=false};document.getElementById('transition-expanded-stale').onclick=function(){};document.getElementById('transition-expanded-visibility-bad').onclick=function(){this.setAttribute('aria-expanded','true')};document.getElementById('transition-pressed-good').onclick=function(){this.setAttribute('aria-pressed','true')};document.getElementById('transition-pressed-stale').onclick=function(){};document.getElementById('transition-tab-good').onclick=function(){this.setAttribute('aria-selected','true');document.getElementById('transition-tabpanel').hidden=false};document.getElementById('transition-tab-stale').onclick=function(){};document.getElementById('transition-invalid-after').onclick=function(){this.setAttribute('aria-pressed','yes')};</script><div id="spacing-good"><div class="spacing-item">A</div><div class="spacing-item">B</div><div class="spacing-item">C</div></div><div id="spacing-bad"><div class="spacing-item">A</div><div class="spacing-item">B</div><div class="spacing-item">C</div></div><div id="spacing-wrapped"><div class="spacing-item">A</div><div class="spacing-item">B</div><div class="spacing-item">C</div></div><div id="spacing-heterogeneous"><div class="spacing-item">A</div><button class="spacing-item">B</button><div class="spacing-item">C</div></div><div id="spacing-element"><div class="spacing-item">A</div><div class="spacing-item">B</div><div class="spacing-item">C</div></div></body></html>
