<!doctype html><html><head><meta charset="utf-8"><style>
#low{color:#777;background:#fff;font-size:16px} #large{color:#949494;background:#fff;font-size:24px} #gradient{color:#aaa;background:linear-gradient(#fff,#000)} #small{width:20px;height:20px} #action{width:100px;height:44px;color:#222;background:#fff;position:relative;z-index:2}

</style></head><body><p id="low">Low contrast</p><h1 id="large">Large text</h1><p id="gradient">Unknown background</p><button id="small">Small</button><button id="action" aria-label="Save">Save</button><div id="wide">Wide content</div></body></html>
